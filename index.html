<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adivina el Número Secreto</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header text-center">
                Adivina el Número Secreto
            </div>
            <div class="card-body">
                <p class="text-center">Ingresa un número entre 1 y 100:</p>
                <div class="input-group mb-3">
                    <input type="number" id="inputNumero" class="form-control" placeholder="Número" min="1" max="100">
                    <button class="btn btn-primary" onclick="adivinarNumero()">Adivinar</button>
                </div>
                <div id="resultado" class="text-center"></div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS (opcional, solo si necesitas funcionalidades de Bootstrap) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="script.js"></script>
</body>
</html>
